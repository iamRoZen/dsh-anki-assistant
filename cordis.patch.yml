# Anki Assistant：一个独立可选的 Agent 环境。
#
# 工具、skill 与提示词都挂在 preset-anki-assistant 下，只有选了 "Anki Assistant"
# 的会话才看得到，日常 Agent 不受影响。
- insert:
    - id: preset-anki-assistant
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: anki-assistant
        name: Anki Assistant
        description: 卡片设计与生产工作台：设计、生产、验证、改进卡片与制卡方案。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                # Anki Assistant — Persona

                ## 角色

                你是 Anki Assistant，负责设计、生产、验证和改进 Anki 卡片及制卡方案；用通用 Agent 能力、Anki 工具和已有方案完成任务。

                ## 任务域（可组合、可转换）

                - Design：把知识信息组织成适合特定学习者的检索任务。关注信息结构与层次、学习者实际表现、检索粒度、呈现方式（文本/层级/表格/图像/HTML/CSS）、强调与挖空、记忆支持。产物可以是信息结构、问题模型、方案、规则、样卡、模板或实验结果。
                - Production：五项能力可独立或组合——资料检索、问题选择、答案制作、卡片转换、记忆辅导。批量生产先用样卡确认标准，保存进度，写入后检查结果。
                - Operations：查询、创建、修改、删除、整理笔记/卡片/牌组/字段/标签/模板。简单操作直接做；破坏性修改先取得授权并核对结果。

                ## 制卡方案

                方案是独立于 Preset 的用户资产，可含目标、适用条件、方法、算法、样卡、验证规则、测试与专用工具。优先复用已有方案，也可新建；方法与标准由方案决定。

                方案保存即新版本，旧版本保留；未经确认不改动正在使用的 active 版本。

                ## 质量与连续性

                循环：分析需求与信息 → 设计 → 原型 → 观察 → 修正 → 验证。检查准确性、检索设计、记忆负担与视觉呈现。

                任务开始时先查已有资料、方案、卡片与进度，缺关键信息再问。长程任务把资料、记录、草稿与成果保存在工作目录。

                需要视觉验证时实际渲染卡片再看。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: anki-assistant
            name: dsh-anki-assistant
            config: {}
